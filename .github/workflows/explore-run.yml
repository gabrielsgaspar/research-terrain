name: Explore run

# Manual only. Runs one merged script, explore/<script>.py, on the
# exploration half, then opens a pull request that records its summary and
# results under research/explore-runs/<idea>/. Every run is recorded, so the
# number of things tried is visible later.
#
# Safety:
#   - Runs only from main, in the analysis environment (main-only), so the
#     code that gets GCP credentials has been reviewed and merged.
#   - The script name is checked against a strict pattern before use.
#   - The run job is terrain-analysis: it reads data/derived/ and
#     data/explore/, writes only data/explore/, and cannot read sealed/. It
#     holds no GitHub write token.
#   - The record job writes the run record and regenerates research/INDEX.md
#     with scripts/build_index.py (merged code that reads only research/),
#     before it asks for the App token; nothing it runs ever sees the token.
#     The summary and results are size-limited and scanned for credentials
#     before they leave the run job.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Script in explore/ without .py, e.g. 0001_feasibility_census"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: explore-run-${{ inputs.script }}
  cancel-in-progress: false

env:
  SCRIPT: ${{ inputs.script }}

jobs:
  run:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    environment: analysis
    permissions:
      contents: read
      id-token: write
    env:
      TERRAIN_BUCKET: research-terrain
    steps:
      - name: Check the input
        run: |
          set -euo pipefail
          [[ "${SCRIPT}" =~ ^[0-9]{4}_[a-z0-9_]{1,60}$ ]] \
            || { echo "::error::script must look like 0001_some_name"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the script exists
        run: |
          test -f "explore/${SCRIPT}.py" \
            || { echo "::error::explore/${SCRIPT}.py does not exist on main"; exit 1; }

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: uv sync --locked

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: terrain-analysis@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Run explore/${{ inputs.script }}.py
        env:
          CODE_COMMIT: ${{ github.sha }}
          EXPLORE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          uv run python "explore/${SCRIPT}.py" --out-dir "${RUNNER_TEMP}/out"

      - name: Check the outputs
        env:
          OUT: ${{ runner.temp }}/out
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os, re, sys

          out = os.environ["OUT"]
          summary_path, results_path = os.path.join(out, "summary.md"), os.path.join(out, "results.json")
          problems = []
          for path, limit in ((summary_path, 20_000), (results_path, 200_000)):
              if not os.path.isfile(path):
                  problems.append(f"missing {os.path.basename(path)}")
              elif os.path.getsize(path) > limit:
                  problems.append(f"{os.path.basename(path)} is over {limit} bytes")
          if not problems:
              text = open(summary_path, encoding="utf-8").read() + open(results_path, encoding="utf-8").read()
              try:
                  json.loads(open(results_path, encoding="utf-8").read())
              except ValueError:
                  problems.append("results.json is not valid JSON")
              if re.search(r"sk-ant-|gh[pousr]_|github_pat_|-----BEGIN|ya29\.|olp_|\"type\"\s*:\s*\"service_account\"", text):
                  problems.append("the outputs contain something that looks like a credential")
          if problems:
              print("\n".join(f"::error::{p}" for p in problems))
              sys.exit(1)
          print("Outputs OK")
          PY

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: explore-out
          path: |
            ${{ runner.temp }}/out/summary.md
            ${{ runner.temp }}/out/results.json
          retention-days: 3

  record:
    needs: run
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: explore-out
          path: ${{ runner.temp }}/in

      - name: Write the record into the tree
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          idea="${SCRIPT:0:4}"
          dir="research/explore-runs/${idea}"
          mkdir -p "${dir}"
          {
            printf '# %s, run %s\n\n' "${SCRIPT}" "${GITHUB_RUN_ID}"
            printf -- '- Script: `explore/%s.py` at `%s`\n' "${SCRIPT}" "${CODE_COMMIT}"
            printf -- '- Run: %s\n' "${RUN_URL}"
            printf -- '- Date (UTC): %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf -- '- Sample: exploration half only\n\n'
            cat "${RUNNER_TEMP}/in/summary.md"
          } > "${dir}/${GITHUB_RUN_ID}.md"
          cp "${RUNNER_TEMP}/in/results.json" "${dir}/${GITHUB_RUN_ID}.json"

      # The index lists every explore run, and a test fails CI when the
      # committed index is out of date (PR #87). Regenerate it here, so the
      # record PR passes CI with no manual step.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Regenerate research/INDEX.md
        run: |
          set -euo pipefail
          uv sync --locked
          uv run python scripts/build_index.py
          git diff --stat -- research/INDEX.md

      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Push a branch and open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          idea="${SCRIPT:0:4}"
          branch="explore/${SCRIPT}-${GITHUB_RUN_ID}"
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git -c core.hooksPath=/dev/null switch -c "${branch}"
          git add -- "research/explore-runs/${idea}/${GITHUB_RUN_ID}.md" "research/explore-runs/${idea}/${GITHUB_RUN_ID}.json" research/INDEX.md
          git -c core.hooksPath=/dev/null \
            -c user.name="${APP_SLUG}[bot]" \
            -c user.email="${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "Explore: record ${SCRIPT} run ${GITHUB_RUN_ID}" -m "From ${RUN_URL}"
          helper='!f() { echo username=x-access-token; echo "password=${PUSH_TOKEN}"; }; f'
          git -c core.hooksPath=/dev/null -c credential.helper= -c "credential.helper=${helper}" \
            push "https://github.com/${REPO}.git" "refs/heads/${branch}:refs/heads/${branch}"
          {
            printf 'Records an `explore-run` of `explore/%s.py` (%s).\n\n' "${SCRIPT}" "${RUN_URL}"
            printf 'Before merging: add a dated entry to `research/lessons.md` and update the idea file in `research/ideas/`, whatever the result, then run `uv run python scripts/build_index.py` and commit `research/INDEX.md` too. Exploration half only; nothing here is a finding.\n\n---\n\n'
            head -c 6000 "research/explore-runs/${idea}/${GITHUB_RUN_ID}.md"
          } > "${RUNNER_TEMP}/body.md"
          gh pr create --repo "${REPO}" --base "${BASE_BRANCH}" --head "${branch}" \
            --title "Explore: ${SCRIPT} (run ${GITHUB_RUN_ID})" --body-file "${RUNNER_TEMP}/body.md"

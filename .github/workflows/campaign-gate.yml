name: Campaign gate

# Posts the `campaign-gate` commit status, a required check on main
# (decision 0010). The gate is plain code: scripts/campaign.py gate, from
# main, reading the pull request through the API. It never checks out or
# runs pull request code.
#
#   - Pull requests the agent App did not open: success at once.
#   - Agent pull requests outside an active campaign: pending until
#     @gabrielsgaspar approves the head commit.
#   - Agent pull requests in an active campaign: success only if every
#     campaign check passes (terrain.campaigns.gate).
#
# Triggers: pull request events (pull_request_target, so the workflow file
# comes from main), reviews, the end of CI and of Agent review (whose
# comments use the job token and so start no workflow themselves), a manual
# dispatch (the tick uses it when a status is missing) and an hourly sweep.
#
# Two jobs: `evaluate` runs repository code with read scopes only; `post`
# holds statuses: write and runs no repository code.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  workflow_run:
    workflows: [CI, Agent review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        type: string
        required: true
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: campaign-gate-${{ github.event.pull_request.number || inputs.pr || github.event.workflow_run.head_branch || 'sweep' }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
      statuses: read
    outputs:
      count: ${{ steps.gate.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: uv sync --locked

      - name: Evaluate the gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_APP_BOT: ${{ vars.AGENT_APP_BOT }}
          EVENT: ${{ github.event_name }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/gate"
          if [ -z "${AGENT_APP_BOT}" ]; then
            echo "::error::The repository variable AGENT_APP_BOT is not set (the agent App's login, e.g. name[bot])."
            exit 1
          fi
          case "${EVENT}" in
            pull_request_target | pull_request_review)
              uv run python scripts/campaign.py gate --pr "${EVENT_PR}" --out "${RUNNER_TEMP}/gate/${EVENT_PR}.json"
              ;;
            workflow_dispatch)
              [[ "${INPUT_PR}" =~ ^[0-9]{1,7}$ ]] || { echo "::error::pr must be a number"; exit 1; }
              uv run python scripts/campaign.py gate --pr "${INPUT_PR}" --out "${RUNNER_TEMP}/gate/${INPUT_PR}.json"
              ;;
            workflow_run)
              [[ "${RUN_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::unexpected head sha"; exit 1; }
              uv run python scripts/campaign.py gate --branch "${RUN_BRANCH}" --sha "${RUN_SHA}" --out "${RUNNER_TEMP}/gate/run.json"
              ;;
            schedule)
              # Every open pull request the agent App opened.
              gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
                --jq ".[] | select(.user.login == \"${AGENT_APP_BOT}\") | .number" > "${RUNNER_TEMP}/open.txt"
              while read -r n; do
                [[ "${n}" =~ ^[0-9]+$ ]] || continue
                uv run python scripts/campaign.py gate --pr "${n}" --out "${RUNNER_TEMP}/gate/${n}.json"
              done < "${RUNNER_TEMP}/open.txt"
              ;;
          esac
          count="$(find "${RUNNER_TEMP}/gate" -name '*.json' | wc -l)"
          echo "count=${count}" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.gate.outputs.count != '0'
        with:
          name: gate
          path: ${{ runner.temp }}/gate/*.json
          retention-days: 3

  post:
    needs: evaluate
    if: needs.evaluate.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gate
          path: ${{ runner.temp }}/gate

      - name: Post the campaign-gate status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          for f in "${RUNNER_TEMP}"/gate/*.json; do
            [ "$(jq -r '.skip' "${f}")" = "false" ] || continue
            sha="$(jq -r '.sha' "${f}")"
            state="$(jq -r '.state' "${f}")"
            description="$(jq -r '.description' "${f}" | cut -c1-140)"
            [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad sha in ${f}"; exit 1; }
            [[ "${state}" =~ ^(success|pending|failure)$ ]] || { echo "::error::bad state in ${f}"; exit 1; }
            gh api --method POST "repos/${REPO}/statuses/${sha}" \
              -f state="${state}" -f context=campaign-gate \
              -f description="${description}" -f target_url="${RUN_URL}" > /dev/null
            echo "PR #$(jq -r '.pr' "${f}") ${sha:0:12}: ${state}: ${description}"
            jq -r '.details[]? | "  - " + .' "${f}"
          done

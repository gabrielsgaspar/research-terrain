name: Unblind

# Manual only. Runs one registered specification, confirm/specs/<spec>.yaml,
# on the confirmation half with the REAL treatment, once, after Gabriel
# approves the unblind environment. Then it opens a pull request that adds
# its entry to confirm/ledger/. Anything run on that specification
# afterwards is labelled post-unblinding. harness/BUILD_PLAN.md 4.8; logic
# and rules in src/terrain/confirm.py.
#
# Refuses, before any data is read, when:
#   - it is not dispatched from main, or the spec name is malformed;
#   - the specification names no plan commit under confirm/pap/ on main;
#   - the ledger on main has no shuffled confirm-run of the same
#     specification (same hash), or that run found something and
#     accept_failed_shuffle is not set;
#   - the ledger on main already has an unblinded entry for the
#     specification;
#   - the branch ledger/unblind-<spec> exists. The run job creates that
#     branch, after approval and before it gets GCP credentials, through an
#     API call that fails if the branch exists. That claim is what stops a
#     second run while the first one's ledger pull request is still open.
#     If a run fails after the claim, it is not retried automatically:
#     Gabriel decides, and removes the branch himself if he wants a rerun.
#
# Safety otherwise as in confirm-run.yml. The App token is minted in the run
# job only for the claim, before GCP credentials exist, and is given to that
# one step.
on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Specification in confirm/specs/ without .yaml, e.g. 0001-direct"
        type: string
        required: true
      accept_failed_shuffle:
        description: "Unblind although the shuffled run found something (recorded in the ledger)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: unblind
  cancel-in-progress: false

env:
  SPEC: ${{ inputs.spec }}
  ACCEPT_FLAG: ${{ inputs.accept_failed_shuffle && '--accept-failed-shuffle' || '' }}

jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check the input
        run: |
          set -euo pipefail
          [[ "${SPEC}" =~ ^[0-9]{4}-[a-z0-9-]{1,40}$ ]] \
            || { echo "::error::spec must look like 0001-some-name"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: uv sync --locked

      - name: Check the specification and the ledger
        run: |
          set -euo pipefail
          test -f "confirm/specs/${SPEC}.yaml" \
            || { echo "::error::confirm/specs/${SPEC}.yaml does not exist on main"; exit 1; }
          uv run python scripts/confirm_run.py check --spec "confirm/specs/${SPEC}.yaml" --mode real ${ACCEPT_FLAG}

  run:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    environment: unblind
    permissions:
      contents: read
      id-token: write
    env:
      TERRAIN_BUCKET: research-terrain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: uv sync --locked

      # Again after approval: the ledger may have changed while the run waited.
      - name: Check the specification and the ledger
        run: uv run python scripts/confirm_run.py check --spec "confirm/specs/${SPEC}.yaml" --mode real ${ACCEPT_FLAG}

      - name: Get a GitHub App token for the claim
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Claim the unblinding (fails if ledger/unblind-<spec> exists)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/${REPO}/git/refs" \
            -f "ref=refs/heads/ledger/unblind-${SPEC}" -f "sha=${GITHUB_SHA}" >/dev/null \
            || { echo "::error::ledger/unblind-${SPEC} exists: ${SPEC} has been unblinded, or a run is under way"; exit 1; }

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: terrain-unblind@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Run the specification with the real treatment
        run: |
          set -euo pipefail
          uv run python scripts/confirm_run.py run --spec "confirm/specs/${SPEC}.yaml" \
            --mode real --out-dir "${RUNNER_TEMP}/out"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unblind-out
          path: ${{ runner.temp }}/out/output.json
          retention-days: 30

  record:
    needs: run
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unblind-out
          path: ${{ runner.temp }}/in

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Write the ledger entry into the tree
        id: entry
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          CODE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          uv sync --locked
          path="$(uv run python scripts/confirm_run.py ledger --spec "confirm/specs/${SPEC}.yaml" \
            --mode real --output "${RUNNER_TEMP}/in/output.json" ${ACCEPT_FLAG})"
          echo "path=${path}" >> "${GITHUB_OUTPUT}"

      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Commit to the claim branch and open the pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          ENTRY: ${{ steps.entry.outputs.path }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          branch="ledger/unblind-${SPEC}"
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          git -c core.hooksPath=/dev/null switch -c "${branch}"
          git add -- "${ENTRY}"
          git -c core.hooksPath=/dev/null \
            -c user.name="${APP_SLUG}[bot]" \
            -c user.email="${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com" \
            commit -m "Ledger: unblinded run of ${SPEC}, run ${GITHUB_RUN_ID}" -m "From ${RUN_URL}"
          helper='!f() { echo username=x-access-token; echo "password=${PUSH_TOKEN}"; }; f'
          # The claim branch points at this run's main commit, so this push
          # is a fast-forward.
          git -c core.hooksPath=/dev/null -c credential.helper= -c "credential.helper=${helper}" \
            push "https://github.com/${REPO}.git" "refs/heads/${branch}:refs/heads/${branch}"
          {
            printf 'Adds the ledger entry of the unblinded run of `confirm/specs/%s.yaml` (%s).\n\n' "${SPEC}" "${RUN_URL}"
            printf 'Real treatment, run once. Anything run on this specification from now on is labelled post-unblinding.\n\n```json\n'
            head -c 6000 "${ENTRY}"
            printf '\n```\n'
          } > "${RUNNER_TEMP}/body.md"
          gh pr create --repo "${REPO}" --base "${BASE_BRANCH}" --head "${branch}" \
            --title "Ledger: unblinded run of ${SPEC} (run ${GITHUB_RUN_ID})" --body-file "${RUNNER_TEMP}/body.md"

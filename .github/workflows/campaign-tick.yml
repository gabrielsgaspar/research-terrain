name: Campaign tick

# Advances every active campaign by at most one step (decision 0010).
#
#   decide  Runs scripts/campaign.py decide from main with read-only scopes:
#           it reads the campaign files and GitHub, and writes a list of
#           actions. No write token is present.
#   act     Holds the agent App's token and runs no repository code: a fixed
#           script below checks each action against a closed list (issue
#           bodies must carry a campaign marker, labels and workflows come
#           from fixed sets, merges name the exact head commit) and carries
#           it out. Merges also need the required checks on main, so a wrong
#           action cannot merge anything the gate and the ruleset refuse.
#
# Every three hours, or by hand. Set the repository variable
# CAMPAIGNS_ENABLED to `true` to run; anything else stops every campaign.
on:
  schedule:
    - cron: "41 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: campaign-tick
  cancel-in-progress: false

jobs:
  decide:
    if: vars.CAMPAIGNS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    outputs:
      count: ${{ steps.decide.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - run: uv sync --locked

      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AGENT_APP_BOT: ${{ vars.AGENT_APP_BOT }}
          CAMPAIGNS_ENABLED: ${{ vars.CAMPAIGNS_ENABLED }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/tick"
          uv run python scripts/campaign.py decide --out "${RUNNER_TEMP}/tick/actions.json" | tee "${RUNNER_TEMP}/tick/log.txt"
          {
            echo '## Campaign tick'
            echo
            echo '```'
            cat "${RUNNER_TEMP}/tick/log.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "count=$(jq 'length' "${RUNNER_TEMP}/tick/actions.json")" >> "${GITHUB_OUTPUT}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.decide.outputs.count != '0'
        with:
          name: tick-actions
          path: ${{ runner.temp }}/tick/actions.json
          retention-days: 7

  act:
    needs: decide
    if: needs.decide.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tick-actions
          path: ${{ runner.temp }}/tick

      - name: Get a GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.AGENT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-actions: write

      - name: Carry out the actions
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          ACTIONS: ${{ runner.temp }}/tick/actions.json
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json, os, re, sys, urllib.error, urllib.request

          REPO, TOKEN = os.environ["REPO"], os.environ["APP_TOKEN"]
          LABELS = {"campaign", "explore", "agent-plan", "agent-build"}
          WORKFLOWS = {
              "explore-run.yml": {"script": r"^[0-9]{4}_[a-z0-9_]{1,60}$", "campaign": r"^[0-9]{4}/s[0-9]{1,2}$"},
              "data-pipeline.yml": {"stage": r"^(acquire|build)$", "target": r"^[a-z][a-z0-9_]{0,63}$",
                                    "campaign": r"^[0-9]{4}/s[0-9]{1,2}$"},
              "campaign-gate.yml": {"pr": r"^[0-9]{1,7}$"},
          }
          MARKER = re.compile(r"<!-- campaign-(step|tracking|closeout|ledger): [0-9]{4}")

          def call(method, path, body=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{REPO}{path}", method=method,
                  data=json.dumps(body).encode() if body is not None else None)
              req.add_header("Authorization", f"Bearer {TOKEN}")
              req.add_header("Accept", "application/vnd.github+json")
              req.add_header("X-GitHub-Api-Version", "2022-11-28")
              with urllib.request.urlopen(req, timeout=30) as resp:
                  text = resp.read().decode()
                  return json.loads(text) if text else None

          def number(x):
              if not isinstance(x, int) or x <= 0:
                  raise ValueError(f"not an issue or PR number: {x!r}")
              return x

          def check_text(body):
              if not isinstance(body, str) or not MARKER.search(body) or len(body) > 60000:
                  raise ValueError("body has no campaign marker or is too long")

          actions = json.load(open(os.environ["ACTIONS"], encoding="utf-8"))
          failed = 0
          for a in actions:
              kind = a.get("type")
              try:
                  if kind == "comment":
                      check_text(a["body"])
                      call("POST", f"/issues/{number(a['issue'])}/comments", {"body": a["body"]})
                      print(f"commented on #{a['issue']}")
                  elif kind == "create_issue":
                      check_text(a["body"])
                      labels, then = list(a.get("labels", [])), list(a.get("then_labels", []))
                      if not set(labels + then) <= LABELS or "campaign" not in labels:
                          raise ValueError(f"labels outside the fixed set: {labels + then}")
                      if not isinstance(a.get("title"), str) or not 0 < len(a["title"]) <= 200:
                          raise ValueError("bad title")
                      issue = call("POST", "/issues", {"title": a["title"], "body": a["body"], "labels": labels})
                      print(f"filed #{issue['number']}: {a['title']}")
                      if then:
                          call("POST", f"/issues/{issue['number']}/labels", {"labels": then})
                          print(f"  labelled {then}")
                  elif kind == "swap_labels":
                      if a.get("remove") != "agent-plan" or a.get("add") != "agent-build":
                          raise ValueError("only agent-plan -> agent-build may be swapped")
                      n = number(a["issue"])
                      try:
                          call("DELETE", f"/issues/{n}/labels/agent-plan")
                      except urllib.error.HTTPError as exc:
                          if exc.code != 404:
                              raise
                      call("POST", f"/issues/{n}/labels", {"labels": ["agent-build"]})
                      print(f"#{n}: agent-plan -> agent-build")
                  elif kind == "merge":
                      sha = a.get("sha", "")
                      if not re.fullmatch(r"[0-9a-f]{40}", sha):
                          raise ValueError("merge needs the exact head sha")
                      n = number(a["pr"])
                      call("PUT", f"/pulls/{n}/merge", {"sha": sha, "merge_method": "merge"})
                      print(f"merged PR #{n} at {sha[:12]}")
                  elif kind == "dispatch":
                      wf, inputs = a.get("workflow"), a.get("inputs", {})
                      allowed = WORKFLOWS.get(wf)
                      if allowed is None or set(inputs) - set(allowed):
                          raise ValueError(f"workflow or inputs not allowed: {wf} {sorted(inputs)}")
                      for key, value in inputs.items():
                          if not isinstance(value, str) or not re.fullmatch(allowed[key], value):
                              raise ValueError(f"bad input {key}={value!r}")
                      call("POST", f"/actions/workflows/{wf}/dispatches", {"ref": "main", "inputs": inputs})
                      print(f"started {wf} {inputs}")
                  else:
                      raise ValueError(f"unknown action type {kind!r}")
              except (ValueError, KeyError, urllib.error.HTTPError, urllib.error.URLError) as exc:
                  failed += 1
                  detail = exc.read().decode()[:300] if isinstance(exc, urllib.error.HTTPError) else ""
                  print(f"::error::{kind} failed: {exc} {detail}")
          sys.exit(1 if failed else 0)
          PY

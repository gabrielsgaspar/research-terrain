name: GCS smoke test

# Manual only. Proves the bucket permissions behave as designed:
#   - terrain-acquire can create an object under data/raw/;
#   - it cannot overwrite that object (raw is create-only);
#   - it cannot write under data/derived/.
# There is no checkout: this job runs no repository code while it holds GCP
# credentials. The test object stays in data/raw/_smoke/ (acquire cannot
# delete it); remove it yourself with gcloud afterwards.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # The environment limits this job to main and is what the Workload
    # Identity binding for terrain-acquire matches on.
    environment: data-write
    permissions:
      contents: read
      id-token: write
    env:
      BUCKET: gs://research-terrain
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: terrain-acquire@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Check create, overwrite and scope
        run: |
          set -uo pipefail
          file="${RUNNER_TEMP}/smoke.txt"
          echo "smoke test ${GITHUB_RUN_ID}" > "${file}"
          raw="${BUCKET}/data/raw/_smoke/${GITHUB_RUN_ID}.txt"
          derived="${BUCKET}/data/derived/_smoke/${GITHUB_RUN_ID}.txt"
          ok=1
          if gcloud storage cp "${file}" "${raw}"; then
            echo "PASS: created ${raw}"
          else
            echo "::error::FAIL: could not create under data/raw/"; ok=0
          fi
          if gcloud storage cp "${file}" "${raw}"; then
            echo "::error::FAIL: overwrote an object under data/raw/"; ok=0
          else
            echo "PASS: overwrite under data/raw/ was refused"
          fi
          if gcloud storage cp "${file}" "${derived}"; then
            echo "::error::FAIL: wrote under data/derived/"; ok=0
          else
            echo "PASS: write under data/derived/ was refused"
          fi
          if gcloud storage ls "${BUCKET}/data/" > /dev/null; then
            echo "PASS: can list data/"
          else
            echo "::error::FAIL: cannot list data/"; ok=0
          fi
          [ "${ok}" = 1 ]

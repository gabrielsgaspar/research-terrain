name: Agent plan

# Only trigger: the `agent-plan` label is added to an issue. No comment,
# @claude, issue_comment or pull_request triggers, on purpose.
# GitHub runs `issues` workflows from the default branch, so this file does
# nothing until it is merged to main.
on:
  issues:
    types: [labeled]

jobs:
  plan:
    if: github.event.label.name == 'agent-plan'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    # Nothing beyond this. GITHUB_TOKEN always has metadata read, which is all
    # the guard below needs to read the collaborator role.
    permissions:
      contents: read
      issues: write
    steps:
      # 1. Guard. Runs before anything else; if it fails, no later step runs.
      #    Both the user who added the label and the author of the issue need
      #    admin or write, because the issue text goes to the planner.
      #    `permission` is admin, write, read or none (maintain counts as write,
      #    triage as read). A failed lookup (for example 404 for a user who is
      #    not a collaborator) also stops the job.
      #    The agent App (repository variable AGENT_APP_BOT) files and labels
      #    campaign issues (decision 0010). An App has no collaborator role to
      #    look up, so its exact login is accepted; logins ending in [bot] are
      #    reserved for Apps, and only our workflows hold this App's key.
      - name: Guard - labelling user and issue author need admin or write
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ACTOR: ${{ github.event.sender.login }}
          AUTHOR: ${{ github.event.issue.user.login }}
          APP_BOT: ${{ vars.AGENT_APP_BOT }}
        run: |
          set -euo pipefail
          for user in "${ACTOR}" "${AUTHOR}"; do
            if [ -n "${APP_BOT}" ] && [ "${user}" = "${APP_BOT}" ]; then
              echo "User ${user} is the agent App (campaigns, decision 0010)."
              continue
            fi
            if ! permission="$(gh api "repos/${REPO}/collaborators/${user}/permission" --jq .permission 2>/dev/null)"; then
              echo "::error::Could not look up the permission of ${user}."
              exit 1
            fi
            echo "User ${user} has permission: ${permission}"
            case "${permission}" in
              admin | write) ;;
              *)
                echo "::error::${user} needs admin or write access to run the planner."
                exit 1
                ;;
            esac
          done

      # 1b. Sandbox dependencies, the same step as agent-build.
      #     The repo's .claude/settings.json turns the Bash sandbox on with
      #     failIfUnavailable, so Claude Code refuses to start (0 turns, no
      #     session init) when bubblewrap or socat is missing or bubblewrap
      #     cannot create a user namespace. The runner image does not list
      #     either package. Runs after the guard so only authorised users reach
      #     the `sudo` calls. https://code.claude.com/docs/en/sandboxing
      #     Two checks, both needed (run 41220196216 passed the first, then
      #     every Bash call failed in apply-seccomp):
      #     - outer: bwrap creates the user namespace each sandboxed command
      #       runs in;
      #     - nested: inside it, apply-seccomp (sandbox-runtime's helper, run
      #       before each sandboxed command) makes a second user namespace and
      #       needs CAP_SYS_ADMIN there to create new PID and mount namespaces.
      #       CLAUDE_CODE_SUBPROCESS_ENV_SCRUB's isolation is bubblewrap too.
      #       https://code.claude.com/docs/en/env-vars
      #       https://github.com/anthropic-experimental/sandbox-runtime (README,
      #       "Ubuntu 24.04+ note"; vendor/seccomp-src/apply-seccomp.c)
      #     What the runners need, from the probe on branch probe/sandbox
      #     (sandbox-runtime 0.0.81 with our rules; runs 41223056223 and
      #     41223897114):
      #     - ubuntu-22.04: kernel.apparmor_restrict_unprivileged_userns is 0;
      #       nothing to do.
      #     - ubuntu-24.04: it is 1 and no bwrap profile ships, so bwrap itself
      #       fails ("setting up uid map: Permission denied").
      #     - ubuntu-26.04: it is 1 and bwrap-userns-restrict ships. Its bwrap
      #       profile moves every command bwrap starts into unpriv_bwrap
      #       ("audit deny capability"), so the nested check fails
      #       ("write /proc/self/setgroups ... Permission denied"). Setting the
      #       sysctl to 0 does not change that transition (still fails), so the
      #       old sysctl fallback is gone.
      #     So, when the restriction is on: unload and disable
      #     bwrap-userns-restrict if present, and load the documented bwrap
      #     profile. Both checks then pass on 24.04 and 26.04 with the
      #     restriction still on for every other program. Acceptable because
      #     the runner is ephemeral (the VM is discarded after the job) and the
      #     runner user already has passwordless sudo. Inside the sandbox,
      #     commands still cannot make user namespaces (apply-seccomp's filter
      #     and user.max_user_namespaces=0; the probe's `unshare --user` was
      #     refused) or use sudo (bwrap sets no_new_privs). The sandbox and the
      #     scrub stay on; settings.json is untouched. If a check still fails,
      #     the step stops here with the reason, instead of Claude failing
      #     every Bash call later.
      - name: Install sandbox dependencies (bubblewrap, socat)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap socat

          sandbox_err="${RUNNER_TEMP}/sandbox.err"
          failed=""
          # Outer: the user namespace bwrap makes for every sandboxed command.
          bwrap_ok() {
            bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid true 2> "${sandbox_err}"
          }
          # Nested: what apply-seccomp does inside that sandbox. unshare with
          # --map-current-user writes setgroups "deny" and an identity uid/gid
          # map (needs CAP_SYS_ADMIN in the new namespace), then makes new PID
          # and mount namespaces, as the helper does.
          nested_ok() {
            bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid --unshare-net --cap-drop ALL \
              unshare --user --map-current-user --pid --mount --fork true 2> "${sandbox_err}"
          }
          sandbox_ok() {
            failed="outer"
            bwrap_ok || return 1
            failed="nested"
            nested_ok || return 1
            failed=""
          }

          restrict="$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          echo "kernel.apparmor_restrict_unprivileged_userns: ${restrict}"
          if [ "${restrict}" = "1" ]; then
            if [ -f /etc/apparmor.d/bwrap-userns-restrict ]; then
              echo "Removing bwrap-userns-restrict (it moves bwrap's commands into unpriv_bwrap)."
              sudo apparmor_parser -R /etc/apparmor.d/bwrap-userns-restrict
              sudo ln -sf /etc/apparmor.d/bwrap-userns-restrict /etc/apparmor.d/disable/
            fi
            echo "Loading the documented AppArmor profile for /usr/bin/bwrap."
            sudo tee /etc/apparmor.d/bwrap > /dev/null <<'EOF'
          abi <abi/4.0>,
          include <tunables/global>

          profile bwrap /usr/bin/bwrap flags=(unconfined) {
            userns,
            include if exists <local/bwrap>
          }
          EOF
            sudo apparmor_parser -r /etc/apparmor.d/bwrap
          fi

          if ! sandbox_ok; then
            echo "AppArmor label of a command bwrap starts: $(bwrap --ro-bind / / --proc /proc --dev /dev --unshare-user --unshare-pid cat /proc/self/attr/current 2>/dev/null || echo unknown)"
            echo "Loaded AppArmor profiles with bwrap in the name:"
            sudo grep -i bwrap /sys/kernel/security/apparmor/profiles || echo "  none"
            if [ "${failed}" = "outer" ]; then
              echo "::error::bubblewrap cannot create its user namespace, so the Claude Code sandbox cannot start. bwrap said: $(< "${sandbox_err}")"
            else
              echo "::error::The sandbox's nested user namespace gets no capabilities, so apply-seccomp would fail every sandboxed Bash command (write /proc/self/setgroups). unshare said: $(< "${sandbox_err}")"
            fi
            exit 1
          fi
          echo "bubblewrap and the nested user namespace work."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # 2. The issue text goes to a file, through env vars (never inline in the
      #    script), so the agent reads it as data rather than as its prompt.
      - name: Write the issue to a file
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          LABELS: ${{ join(github.event.issue.labels.*.name, ', ') }}
        run: |
          set -euo pipefail
          mkdir -p .agent-plan
          {
            printf '# %s\n\n' "${ISSUE_TITLE}"
            printf 'Labels: %s\n\n' "${LABELS}"
            printf '%s\n' "${ISSUE_BODY}"
          } > .agent-plan/issue.md

      # research/INDEX.md is not in git: it is built where it is read, from
      # this checkout's records, so the planner can read it. The builder uses
      # the standard library only, so the runner's own python3 runs it.
      - name: Build research/INDEX.md
        run: python3 -I scripts/build_index.py

      # The planner's instructions, model and turn limit now live in
      # harness/roles/planner.md; scripts/role.py checks and loads them.
      - name: Load the planner's instructions
        id: role
        run: python3 -I scripts/role.py planner

      # 3. Claude, read-only. 40 turns: a data task's plan reads the issue,
      #    AGENTS.md, the catalog, manifests, fixture notes and the code it
      #    replaces; task 04 needed 21 and hit the old limit of 20 (issue #26).
      #    autoAllowBashIfSandboxed is false: with the sandbox's default
      #    (true), any sandboxed command runs without matching --allowedTools,
      #    so the allowlist would not be enforced (seen in PR #38's review).
      #    `--tools` limits which built-in tools exist;
      #    --allowedTools limits Bash to git log; --disallowedTools removes MCP
      #    tools, blocks `--output` (which would let git write a file) and
      #    `--no-index` (which lets git read any file), and denies Read of the
      #    runner's system and credential paths. `git diff` is not allowed at
      #    all: with one path outside the work tree it reads that file even
      #    without --no-index. `git log -p` refuses such paths.
      #    The `settings` input makes Read, Grep and Glob refuse everything
      #    outside the checkout. Absolute path rules start with `//`; none of
      #    them covers /home/runner/work/research-terrain/research-terrain.
      #    https://code.claude.com/docs/en/permissions#how-path-patterns-match
      #    https://code.claude.com/docs/en/settings-reference#permissions-blockreadsoutsideworkingdirectories
      #    The result comes back as structured output.
      #    allowed_bots: the action refuses bot actors, and in a campaign the
      #    agent App files the issue and adds `agent-plan` (decision 0010), so
      #    the actor is terrain-agent[bot]. Only our App, never `*`.
      - name: Plan
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1.0.266
        env:
          # Strips credentials from Bash subprocess environments (it keeps
          # GitHub tokens). The Claude process itself keeps its credentials.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The job token, not the Claude GitHub App: this skips the OIDC
          # exchange, so the job needs no `id-token: write`.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: terrain-agent[bot]
          settings: '{"permissions":{"blockReadsOutsideWorkingDirectories":true},"sandbox":{"autoAllowBashIfSandboxed":false}}'
          claude_args: |
            --model ${{ steps.role.outputs.model }}
            --max-turns ${{ steps.role.outputs.max_turns }}
            --tools "Read,Grep,Glob,Bash"
            --allowedTools "Read" "Grep" "Glob" "Bash(git log *)"
            --disallowedTools "mcp__*" "Edit" "Write" "NotebookEdit" "Bash(* --output*)" "Bash(git diff --no-index*)" "Bash(* --no-index*)" "Read(//proc/**)" "Read(//etc/**)" "Read(//root/**)" "Read(//tmp/**)" "Read(//home/runner/.*)" "Read(//home/runner/.*/**)" "Read(//home/runner/work/_temp/**)" "Read(//home/runner/work/_actions/**)" "Read(//home/runner/work/_tool/**)" "Read(//home/runner/runners/**)"
            --json-schema '{"type":"object","properties":{"status":{"type":"string","enum":["plan","unclear","out_of_scope"]},"comment":{"type":"string"},"files":{"type":"array","items":{"type":"object","properties":{"path":{"type":"string"},"change":{"type":"string","enum":["add","modify","delete"]},"why":{"type":"string"}},"required":["path","change"]}}},"required":["status","comment"]}'
          prompt: ${{ steps.role.outputs.prompt }}

      # 4. One comment, written by a deterministic step with the job token.
      #    The agent has no way to post it. Skipped when the guard failed.
      #    Before posting, the comment is checked for the two token values and
      #    for common token prefixes; on a match nothing is posted. The values
      #    are compared inside bash (never printed, never in a command line).
      - name: Post the plan comment
        if: ${{ !cancelled() && steps.claude.conclusion != 'skipped' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          JOB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STRUCTURED: ${{ steps.claude.outputs.structured_output }}
          LABELS_JSON: ${{ toJSON(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail
          # Compose the comment. Any problem (no usable result, a bad file
          # list) produces a short "withheld" notice instead, so the reason
          # shows on the issue, not only in this log. The build refuses a
          # withheld plan: it only accepts "## Agent plan: Plan".
          python3 -I - <<'PY'
          import json, os, re, sys

          out = os.path.join(os.environ["RUNNER_TEMP"], "comment.md")
          run = os.environ["RUN_URL"]
          footer = (
              "\n\n---\n_Written by the `agent-plan` workflow. Read-only: it changed "
              f"no files, labels or settings. [Run]({run})._\n"
          )


          def withheld(reason):
              with open(out, "w", encoding="utf-8") as f:
                  f.write(
                      f"## Agent plan: withheld\n\n{reason}\n\nNothing was planned. See the "
                      f"[run]({run}), fix the cause, then add `agent-plan` again.\n"
                  )
              sys.exit(0)


          try:
              data = json.loads(os.environ.get("STRUCTURED") or "")
          except ValueError:
              data = None
          if not isinstance(data, dict):
              withheld("The planner returned no usable result. Common causes: it ran out of turns, or the run failed before it finished.")
          titles = {
              "plan": "Plan",
              "unclear": "Needs clarification - no plan yet",
              "out_of_scope": "Out of scope under AGENTS.md - no plan",
          }
          status, comment = data.get("status"), (data.get("comment") or "").strip()
          if status not in titles or not comment:
              withheld("The planner returned no usable result.")
          body = comment[:60000]
          explore = "explore" in json.loads(os.environ.get("LABELS_JSON") or "[]")
          if status == "plan":
              files = data.get("files")
              if not isinstance(files, list) or not files:
                  withheld("The plan has no file list, so the build could not check what it changes.")
              path_ok = re.compile(r"[A-Za-z0-9_.][A-Za-z0-9_./-]*")
              labels = {"add": "new", "modify": "changed", "delete": "deleted with git rm"}
              clean, seen, problems = [], set(), []
              for item in files:
                  item = item if isinstance(item, dict) else {}
                  path = str(item.get("path", "")).strip().removeprefix("./")
                  change = item.get("change")
                  why = " ".join(str(item.get("why", "")).split())[:300]
                  parts = path.split("/")
                  if not path_ok.fullmatch(path) or ".." in parts or "" in parts:
                      problems.append(path or "(empty)")
                  elif change not in labels:
                      problems.append(f"{path} (change must be add, modify or delete)")
                  elif path not in seen:
                      seen.add(path)
                      clean.append({"path": path, "change": change, "why": why})
              if explore and not problems:
                  outside = [f["path"] for f in clean if not f["path"].startswith(("explore/", "tests/test_explore"))]
                  if outside:
                      shown = ", ".join(f"`{p}`" for p in outside[:20])
                      withheld(
                          f"This is an `explore` issue, which may change only `explore/` and `tests/test_explore*`, "
                          f"but the plan lists {shown}. Move that work to a separate build task."
                      )
              if problems:
                  shown = ", ".join(f"`{p}`" for p in problems[:20])
                  withheld(
                      f"The plan's file list has entries that are not single full paths: {shown}. "
                      "Each file must be listed on its own, with no braces, wildcards or directories."
                  )
              section = ["**Files to change**", ""]
              for f in clean:
                  section.append(f"- `{f['path']}` ({labels[f['change']]})" + (f": {f['why']}" if f["why"] else ""))
              block = "\n".join(section) + "\n\n"
              at = body.find("**Steps**")
              body = body[:at] + block + body[at:] if at >= 0 else body + "\n\n" + block
              # Machine-readable copy for verify and the reviewer. Paths are
              # checked above, so they cannot close the HTML comment.
              hidden = json.dumps([{"path": f["path"], "change": f["change"]} for f in clean], separators=(",", ":"))
              body += f"\n\n<!-- agent-files: {hidden} -->"
          with open(out, "w", encoding="utf-8") as f:
              f.write(f"## Agent plan: {titles[status]}\n\n{body}{footer}")
          PY
          body="$(< "${RUNNER_TEMP}/comment.md")"
          blocked=""
          # An empty value is skipped: an empty pattern would match everything.
          for secret in "${CLAUDE_CODE_OAUTH_TOKEN:-}" "${JOB_TOKEN:-}"; do
            if [ -n "${secret}" ] && [[ "${body}" == *"${secret}"* ]]; then blocked="a secret value"; fi
          done
          if grep -qE 'sk-ant-|ghp_|ghs_|github_pat_|ya29\.|olp_' <<< "${body}"; then
            blocked="text that looks like a credential prefix"
          fi
          if [ -n "${blocked}" ]; then
            # The notice names the kind of match, never the text itself.
            printf '## Agent plan: withheld\n\nThe plan was not posted because it contained %s. Nothing was planned. See the [run](%s), then add `agent-plan` again. AGENTS.md: never write credential prefixes anywhere.\n' \
              "${blocked}" "${RUN_URL}" > "${RUNNER_TEMP}/comment.md"
            gh issue comment "${ISSUE_NUMBER}" --body-file "${RUNNER_TEMP}/comment.md"
            echo "::error::The plan contained ${blocked}; posted a withheld notice instead."
            exit 1
          fi
          gh issue comment "${ISSUE_NUMBER}" --body-file "${RUNNER_TEMP}/comment.md"

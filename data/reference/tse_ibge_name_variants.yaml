# Reviewed exceptions for the TSE-IBGE municipality crosswalk.
#
# The crosswalk takes its TSE-IBGE code pairs from the Hidalgo geocoded
# polling stations (catalog: polling_stations_geocoded) and checks every pair
# by comparing the TSE name with the IBGE DTB 2024 name, after upper-casing,
# removing accents and treating apostrophes and hyphens as spaces. The pairs
# below fail that comparison for known reasons (spelling or a renamed
# municipality) and were checked by hand on 2026-11-02. Any other mismatch
# fails the build.
#
# Human-maintained: agents may read this file but not change it.

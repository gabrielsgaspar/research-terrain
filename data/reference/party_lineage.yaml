# PROPOSAL, NOT REVIEWED: party lineage across the municipal elections 2008-2024.
#
# Drafted by Claude Code (autonomous run, 2026-11-07) from memory, for idea
# 0004 (research/ideas/0004-mayor-alignment.md). NOT CHECKED against the TSE
# party register. Every row must be checked against the TSE files (sg_partido
# and nr_partido in each year's consulta_cand) before any code uses it. Not to
# be merged until Gabriel has reviewed it.
#
# One entry per lineage: the sigla (and number) the party used in each
# municipal election. null means the party did not run in that election (it
# did not exist yet, or it had been merged into another lineage). `absorbed`
# lists parties merged into this lineage, with the last election in which
# each ran on its own.
#
# Why it is needed: a party's sigla and even its number change across
# elections (PMDB -> MDB; PR -> PL; number 25 was DEM until 2020 and is PRD in
# 2024). Alignment within one election does not need this table; anything
# that follows a party across elections does.
#
# Human-maintained: agents may read this file but not change it.

# Every dataset the project uses. Code reads GCS paths from here and never
# hard-codes them. Add an entry (status: planned) before writing code for it.
#
# Fields:
#   name:     id used in code and idea files
#   source:   where it comes from (URL or publisher)
#   licence:  terms of use
#   gcs:      path under gs://research-terrain/ (raw is write-once: new
#             downloads go to a new dated folder)
#   status:   planned or available; what has reached GCS is in data/manifests/
#   derived:  (optional) folder under gs://research-terrain/ where the build
#             writes <hash>/ folders; code reads it from here
#   sealed:   (optional) folder under sealed/outcomes/ where an outcome build
#             writes the confirmation half's <hash>/ folders (decision 0003);
#             code reads it from here and only creates objects there
#   contract: schema file in data/contracts/, once built
#   notes:    caveats
#   acquire:  (optional) what the generic acquirer downloads for this
#             dataset (issue draft 04):
#               files:
#                 - url: https://.../name_<year>_<uf>.zip
#                   years: [...]        # expands <year>, if present
#                   ufs: [...]          # expands <uf>, if present
#                   check: {type: zip, member: "*_BRASIL.csv"}
#             check types: zip (optionally a required member glob), ods,
#             gzip. Every file is checked before anything is uploaded.

datasets:
  - name: ibge_municipalities
    source: IBGE territorial division (DTB) 2024 and the Legal Amazon list 2024
    licence: public
    gcs: data/raw/ibge/municipalities/
    status: available
    notes: >
      DTB 2024 has 5,571 municipalities; the Legal Amazon list has 773. Both
      are ODS spreadsheets; read them with zipfile and ElementTree (no extra
      dependency). Input to the municipalities build and to
      scripts/seal_split.py.
    acquire:
      files:
        - url: https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/divisao_territorial/2024/DTB_2024.zip
          check: {type: zip, member: "RELATORIO_DTB_BRASIL_2024_MUNICIPIOS.ods"}
        - url: https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/amazonia_legal/2024/Municipios_da_Amazonia_Legal_2024.ods
          check: {type: ods}

  - name: ibge_population_2022
    source: IBGE, Censo Demografico 2022, Populacao e Domicilios - Primeiros Resultados (2nd count, 2023-12-22), table CD2022_Populacao_2010_Compatibilizada
    licence: public
    gcs: data/raw/ibge/population/
    status: planned
    notes: >
      Decision 0011. One ODS, sheet "Municípios", 5,570 municipalities: the
      2010 census population (Sinopse), the 2010 population on 2022
      boundaries ("População 2010 (Alterações de Limites até 2022)", the
      column used) and the 2022 census population. Codes come split as
      COD. UF (2 digits) and COD. MUNIC (5 digits); numbers use a space as
      thousands separator ("24 392"). Boa Esperança do Norte (MT, created
      after the census) is not listed. Input to non_amazon_municipalities.
    acquire:
      files:
        - url: https://ftp.ibge.gov.br/Censos/Censo_Demografico_2022/Populacao_e_domicilios_Primeiros_resultados/Resultados_da_2a_apuracao_20231027/CD2022_Populacao_2010_Compatibilizada_20231222.ods
          check: {type: ods}

  - name: tse_votes_by_section
    source: https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/
    licence: public
    gcs: data/raw/tse/sections/
    status: available
    notes: >
      One zip per state and year; the 26 states that elect councils (all but
      DF), 182 zips, about 6.35 GB (HEAD requests of 2026-11-10: 2000 0.23
      GB, 2004 0.28, 2008 0.39, 2012 0.33, 2016 1.40, 2020 1.93, 2024 1.79);
      the largest zip is SP 2020 at 527 MB. DF is left out on purpose:
      Brasilia elects no council, and for every municipal year the TSE answers
      votacao_secao_<year>_DF.zip with HTTP 200 and a 1-byte body, so the zip
      check would fail the whole acquire. The acquire re-downloads the nine
      Legal Amazon states into the new dated folder, because the generic
      acquirer stores every listed file in one folder.
      2000 is unusable for geography (no polling-place IDs, and in PA only 93
      of 143 municipalities). From 2004 every row has a polling-place ID;
      from 2024 also SQ_CANDIDATO. In PA, section sums equal the results file
      exactly for every candidate in 2008 and 2024.
    acquire:
      files:
        - url: https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_secao/votacao_secao_<year>_<uf>.zip
          years: [2000, 2004, 2008, 2012, 2016, 2020, 2024]
          ufs: [AC, AL, AM, AP, BA, CE, ES, GO, MA, MG, MS, MT, PA, PB, PE, PI, PR, RJ, RN, RO, RR, RS, SC, SE, SP, TO]
          check: {type: zip, member: "votacao_secao_*.csv"}

  - name: tse_polling_places
    source: https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_locais_votacao/
    licence: public
    gcs: data/raw/tse/polling_places/
    status: available
    notes: >
      Polling place for every section, with TSE coordinates for 77% (2012) to
      96% (2024) of rows. Not published before 2010; use
      polling_stations_geocoded for 2008. Contains school phone numbers:
      never print them. National: one file per year for all states; the
      acquire of campaign 0006 step s3 is expected to report unchanged.
    acquire:
      files:
        - url: https://cdn.tse.jus.br/estatistica/sead/odsele/eleitorado_locais_votacao/eleitorado_local_votacao_<year>.zip
          years: [2012, 2016, 2020, 2024]
          check: {type: zip, member: "eleitorado_local_votacao_*.csv"}

  - name: tse_results
    source: https://cdn.tse.jus.br/estatistica/sead/odsele/ (votacao_candidato_munzona, votacao_partido_munzona, detalhe_votacao_munzona, consulta_coligacao)
    licence: public
    gcs: data/raw/tse/results/
    derived: data/derived/tse_results/
    contract: data/contracts/tse_results.md
    status: available
    notes: >
      Votes per candidate and per party by municipality and zone, turnout by
      municipality and zone, and coalition composition; 2000-2024, about
      480 MB. Each zip repeats every row in a BRASIL file. Before 2012
      SQ_CANDIDATO is unique only within a municipality. See
      data/fixtures/tse/README.md.
    acquire:
      files:
        - url: https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_candidato_munzona/votacao_candidato_munzona_<year>.zip
          years: [2000, 2004, 2008, 2012, 2016, 2020, 2024]
          check: {type: zip, member: "*_BRASIL.csv"}
        - url: https://cdn.tse.jus.br/estatistica/sead/odsele/votacao_partido_munzona/votacao_partido_munzona_<year>.zip
          years: [2000, 2004, 2008, 2012, 2016, 2020, 2024]
          check: {type: zip, member: "*_BRASIL.csv"}
        - url: https://cdn.tse.jus.br/estatistica/sead/odsele/detalhe_votacao_munzona/detalhe_votacao_munzona_<year>.zip
          years: [2000, 2004, 2008, 2012, 2016, 2020, 2024]
          check: {type: zip, member: "*_BRASIL.csv"}
        - url: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_coligacao/consulta_coligacao_<year>.zip
          years: [2000, 2004, 2008, 2012, 2016, 2020, 2024]
          check: {type: zip, member: "*_BRASIL.csv"}

  - name: tse_candidates
    source: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_<year>.zip
    licence: public
    gcs: data/raw/tse/candidates/
    derived: data/derived/tse_candidates/
    contract: data/contracts/tse_candidates.md
    status: available
    notes: >
      Municipal elections 2000-2024. Race self-declared from 2016 in municipal
      elections. Files are re-generated by the TSE; see
      data/fixtures/tse/README.md for structure and pitfalls.
    acquire:
      files:
        - url: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand/consulta_cand_<year>.zip
          years: [2000, 2004, 2008, 2012, 2016, 2020, 2024]
          check: {type: zip, member: "*_BRASIL.csv"}
        - url: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand_complementar/consulta_cand_complementar_<year>.zip
          years: [2020, 2024]
          check: {type: zip, member: "*_BRASIL.csv"}

  - name: tse_parties
    source: built from tse_results (votacao_partido_munzona, consulta_coligacao) and municipalities
    licence: public
    derived: data/derived/tse_parties/
    contract: data/contracts/tse_parties.md
    status: available
    notes: >
      Party votes by municipality, zone, office and round, and one row per
      party in each coalition or federation, 2000-2024, with cd_ibge. One
      Parquet file per year and kind.

  - name: tse_candidates_complementar
    source: https://cdn.tse.jus.br/estatistica/sead/odsele/consulta_cand_complementar/consulta_cand_complementar_<year>.zip
    licence: public
    gcs: data/raw/tse/candidates/
    status: available
    notes: >
      2020 and 2024 only; acquired together with tse_candidates, in the same
      raw folder. Indigenous ethnicity and quilombola status, filled in
      2024 only. Joins to tse_candidates on ANO_ELEICAO, CD_ELEICAO and
      SQ_CANDIDATO.

  - name: polling_stations_geocoded
    source: https://github.com/fdhidalgo/geocode_br_polling_stations (release v0.16)
    licence: check the repository licence
    gcs: data/raw/geocodes/hidalgo/
    status: available
    notes: >
      Geocoded polling stations for 2006-2024, with TSE and IBGE municipality
      codes, a per-station error bound (conf_dist_km) and panel IDs. Pinned to
      v0.16: local_id is not comparable across releases. Its TSE-IBGE pairs
      are the crosswalk source (a community crosswalk had 7 wrong codes).
    acquire:
      files:
        - url: https://github.com/fdhidalgo/geocode_br_polling_stations/releases/download/v0.16/geocoded_polling_stations.csv.gz
          check: {type: gzip}
        - url: https://github.com/fdhidalgo/geocode_br_polling_stations/releases/download/v0.16/panel_ids.csv.gz
          check: {type: gzip}
        - url: https://github.com/fdhidalgo/geocode_br_polling_stations/releases/download/v0.16/section_panel_mapping.csv.gz
          check: {type: gzip}

  - name: municipalities
    source: built from ibge_municipalities, polling_stations_geocoded and tse_candidates
    licence: public
    derived: data/derived/municipalities/
    contract: data/contracts/municipalities.md
    status: available
    notes: >
      One row per IBGE municipality (DTB 2024) with its TSE code, both names
      and a Legal Amazon flag. Every TSE-IBGE pair is checked by name;
      reviewed exceptions are in data/reference/tse_ibge_name_variants.yaml.
      Also writes legal_amazon.csv, the input to scripts/seal_split.py.

  - name: non_amazon_municipalities
    source: built from municipalities and ibge_population_2022
    licence: public
    derived: data/derived/non_amazon_municipalities/
    contract: data/contracts/non_amazon_municipalities.md
    status: planned
    notes: >
      Decision 0011: the municipalities outside the Legal Amazon (4,798
      expected), each with its state and 2010 population on 2022 boundaries,
      as non_amazon.csv, the input to scripts/seal_split.py --non-amazon.

  - name: polling_places
    source: built from tse_polling_places, polling_stations_geocoded and municipalities
    licence: public
    derived: data/derived/polling_places/
    contract: data/contracts/polling_places.md
    status: available
    notes: >
      Located polling places of Brazil, one Parquet per election
      year (2008, 2012, 2016, 2020, 2024). TSE coordinates where present,
      otherwise Hidalgo's; 2008 from Hidalgo only. Carries panel_id, an
      error bound (conf_dist_km) and the 8-digit postal code (nr_cep).
      Phone numbers are never kept.

  - name: section_votes
    source: built from tse_votes_by_section, tse_results and municipalities
    licence: public
    derived: data/derived/section_votes/
    contract: data/contracts/section_votes.md
    status: available
    notes: >
      Votes by section for Brazil, 2004-2024 (2000 skipped), one
      Parquet per state and year, with the polling-place number and, for
      candidate votes, the candidacy key. Votes are votes cast: candidacies
      annulled in the results are flagged, and margins must use counted votes.

  - name: ibge_localities
    source: IBGE, Localidades do Brasil 2022 (points)
    licence: public
    gcs: data/raw/ibge/localities/
    status: available
    notes: >
      96,163 localities with a category: Cidade (municipal seat), Vila and
      Nucleo Urbano (towns), Povoado, Lugarejo, Nucleo Rural and Outras
      Localidades (rural), Localidade Indigena, Localidade Quilombola, Agrovila
      do PA (agrarian-reform settlement village). GeoPackage, read with
      sqlite3: the table has LAT_LOCALIDADE and LONG_LOCALIDADE columns, so no
      geometry library is needed. Every Legal Amazon municipality has a seat.
    acquire:
      files:
        - url: https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/localidades/Localidades_do_Brasil/2022/Localidades_Brasil_gpkg.zip
          check: {type: zip, member: "BR_localidades_2022.gpkg"}

  - name: ibge_urbanized_areas
    source: IBGE, Areas Urbanizadas do Brasil 2022 (polygons)
    licence: public
    gcs: data/raw/ibge/urbanized_areas/
    status: available
    notes: >
      190,172 polygons (37,491 in the Legal Amazon box), SIRGAS 2000. The
      field Tipo holds the type (Area urbanizada, Outros equipamentos urbanos,
      Vazio intraurbano, Loteamento vazio); Densidade holds the density. Read
      with pyshp and shapely. Editions 2005 and 2019 exist for robustness.
    acquire:
      files:
        - url: https://geoftp.ibge.gov.br/organizacao_do_territorio/tipologias_do_territorio/areas_urbanizadas_do_brasil/2022/Shapefile/AreasUrbanizadas2022_Brasil.zip
          check: {type: zip, member: "*.shp"}

  - name: polling_place_types
    source: built from polling_places, ibge_localities, ibge_urbanized_areas and tse_polling_places
    licence: public
    derived: data/derived/polling_place_types/
    contract: data/contracts/polling_place_types.md
    status: available
    notes: >
      Each Legal Amazon polling place, 2008-2024, typed as seat, town, rural,
      quilombola, indigenous, settlement or dispersed, with eligible voters
      (2012-2024). Draft: harness/issue-drafts/09-build-polling-place-types.md.

  - name: polling_place_tenure
    source: built from polling_places and cnfp_public_forests
    licence: public
    derived: data/derived/polling_place_tenure/
    contract: data/contracts/polling_place_tenure.md
    status: available
    notes: >
      Distance in km from every Legal Amazon polling place, 2008-2024, to the
      nearest indigenous land and undesignated public forest (from that
      election year's register edition) and settlement (from the 2025
      edition, created by that election). Draft:
      harness/issue-drafts/14-build-polling-place-tenure.md.

  - name: ibge_grid_2022
    source: IBGE, Grade Estatistica, Censo 2022, 1 km cells (reissued 2025-10-02)
    licence: public
    gcs: data/raw/ibge/grid_2022/
    status: available
    notes: >
      Census 2022 population on IBGE's 1 km grid, all of Brazil: one
      shapefile, 8,860,553 cells, polygons in SIRGAS 2000 degrees. The cells
      are 1 km squares in IBGE's Albers equal-area projection (central
      meridian -54; parameters in Notas_metodologicas_grade_estatistica_2022.pdf).
      Fields nome_1KM (for example 1KME4879N7849: Albers easting and northing
      in km), QUADRANTE (tile, ID_04 ...), TOTAL (population), TOTAL_DOM
      (occupied households). The 2025-10-02 reissue adds the empty cells that
      earlier versions left out. In the Legal Amazon box (longitude -74 to
      -43, latitude -18.5 to 5.5): 6,105,735 cells, 533,990 populated, 40.5
      million people. See data/fixtures/ibge/README.md for the cell names.
    acquire:
      files:
        - url: https://geoftp.ibge.gov.br/recortes_para_fins_estatisticos/grade_estatistica/censo_2022/grade_1km/BR1KM_20251002.zip
          check: {type: zip, member: "BR1KM.shp"}

  - name: ibge_grid_2010
    source: IBGE, Grade Estatistica, Censo 2010, one zip per tile
    licence: public
    gcs: data/raw/ibge/grid_2010/
    status: available
    notes: >
      Census 2010 population on IBGE's grid, the 38 tiles that meet the Legal
      Amazon box (ID_33-36, 42-46, 50-56, 60-66, 70-76, 80-85, 92, 93),
      8,834,513 rows, 579 MB. Polygons in SIRGAS 2000 degrees. Rows are 1 km
      cells in rural areas and 200 m cells in urban ones: ID_UNICO names the
      cell (1KME... or 200ME...), nome_1KM its 1 km parent, the same names
      as ibge_grid_2022, so aggregate to nome_1KM and join the censuses on
      it. Fields MASC, FEM, POP, DOM_OCU (occupied households), QUADRANTE,
      and parents nome_5KM ... nome_500KM. expand_urls substitutes only
      <year> and <uf>, so every tile is listed.
    acquire:
      files:
        - url: https://geoftp.ibge.gov.br/recortes_para_fins_estatisticos/grade_estatistica/censo_2010/grade_id33.zip
          check: {type: zip, member: "*.shp"}

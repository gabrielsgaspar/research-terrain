  - name: cnfp_public_forests
    source: Servico Florestal Brasileiro, Cadastro Nacional de Florestas Publicas (editions 2008, 2012, 2016, 2020, 2024 retificado, 2025)
    licence: public
    gcs: data/raw/cnfp/
    status: available
    notes: >
      Public forests by year: designated (TIPO A: indigenous lands, settlements,
      protected areas, military) and undesignated (TIPO B, GLEBA ARRECADADA,
      "land without owner or voters"). Served from the Forest Service's ArcGIS
      portal: every file URL ends in /data, so each file has an explicit name,
      and its version and size come from the item's metadata (meta, ?f=json),
      because downloads have no Content-Length and HEAD has no ETag. Schemas
      differ by edition (2008: tipo_flor, long category names; 2016-2025:
      tipo, abbreviations such as TI, PA, PAE, PDS). Only 2025 includes
      conventional settlements (PA: 6,135); every settlement and most
      indigenous lands carry a creation date (anocriacao, dd/mm/yyyy). Some
      text fields are cut mid-character: decode with errors replaced.

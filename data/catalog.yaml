  - name: grid_cells
    source: built from ibge_grid_2022, ibge_grid_2010, ibge_boundaries_2024, cnfp_public_forests and municipalities
    licence: public
    derived: data/derived/grid_cells/
    contract: data/contracts/grid_cells.md
    status: available
    notes: >
      Every 1 km IBGE grid cell whose centre lies in a Legal Amazon
      municipality (5,029,081 cells), with its Albers and SIRGAS 2000
      coordinates, municipality, 2010 and 2022 population and households, and
      the share of the cell inside indigenous land, settlements and
      undesignated forest for each election year 2008-2024. The 2010 grid
      counts 2-7% fewer people than the 2010 census in every state. Draft:
      harness/issue-drafts/19-build-grid-cells.md.

  - name: cell_exposure
    source: built from grid_cells, polling_places, section_votes and tse_results
    licence: public
    derived: data/derived/cell_exposure/
    contract: data/contracts/cell_exposure.md
    status: available
    notes: >
      Decision 0004: each Legal Amazon 1 km cell's exposure to the close
      council races (margin at most 0.5%) of its municipality, winner minus
      loser of the exp(-d/2 km)-weighted mean vote share at the polling places
      within 10 km, with the 2 and 5 km rings; both halves (treatment-side
      data, decision 0003). One Parquet per election year 2008-2024. Draft:
      harness/issue-drafts/24-build-cell-exposure.md.

  - name: cell_displacement
    source: built from grid_cells, cell_exposure, polling_places, section_votes and tse_results
    licence: public
    derived: data/derived/cell_displacement/
    contract: data/contracts/cell_displacement.md
    status: available
    notes: >
      Decision 0005: each empty Legal Amazon 1 km cell not reached by
      cell_exposure, in a municipality with a close council race, and its
      exposure to the winner's rather than the loser's stronghold,
      exp(-d/10 km) to 50 km, with the 10-20 and 20-50 km rings; both halves
      (treatment-side data, decision 0003). One Parquet per election year
      2008-2024. Draft: harness/issue-drafts/30-build-cell-displacement.md.

  - name: mapbiomas_deforestation
    source: MapBiomas Brasil Collection 10, deforestation and secondary vegetation (Earth Engine asset below)
    licence: CC-BY-SA 4.0; cite MapBiomas
    gcs: data/raw/mapbiomas/
    status: available
    notes: >
      Decision 0006. Codes 1 anthropic, 2 primary vegetation, 3 secondary
      vegetation, 4 loss of primary vegetation, 5 recovery to secondary
      vegetation, 6 loss of secondary vegetation, 7 transition noise; one band
      per year 1985-2024 at 30 m (EPSG:4326, 154,468 x 146,235 pixels). A loss
      is confirmed by the next year, so the latest year can change. Acquired
      as each code's share of every IBGE 1 km cell (x 10,000, uint16), one
      GeoTIFF per year on the grid of grid_cells, by Earth Engine batch export
      as terrain-acquire. Outcome data: raw holds both halves and no
      exploration account can read raw (decision 0003). Draft:
      harness/issue-drafts/26-acquire-mapbiomas.md.
    earthengine:
      asset: projects/mapbiomas-public/assets/brazil/lulc/collection10/mapbiomas_brazil_collection10_deforestation_secondary_vegetation_v2
      band: classification_<year>
      years: [2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]
      codes: [1, 2, 3, 4, 5, 6, 7]
      scale: 10000
      grid_km: {x0: 2823, x1: 6173, y0: 9322, y1: 11902}
      file: mapbiomas_shares_<year>.tif

  - name: cell_outcomes

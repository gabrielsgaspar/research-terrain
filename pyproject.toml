[project]
name = "terrain"
version = "0.1.0"
description = "Agent-assisted research on how elections shape land, forests and public goods in Brazil."
readme = "README.md"
authors = [
    { name = "Gabriel Gaspar", email = "gabrielsgaspar@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "earthengine-api>=1.7.51",
    "google-cloud-storage>=3.17.1",
    "matplotlib>=3.11.2",
    "polars>=2.1.0",
    "pyproj>=3.8.0",
    "pyshp>=3.1.6",
    "pyyaml>=6.0.3",
    "shapely>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "overleaf"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
